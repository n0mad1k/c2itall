---
# Join one lab member to the gateway's WireGuard hub as interface lab0 (wg0 is
# LUDUS's own interface on a LUDUS host). The adapter runs this
# before the member's own service play with two hosts: the member (reached
# through the gateway when it has no public address) and the gateway.
- name: Join the lab overlay
  hosts: member
  become: true
  vars:
    # A host that fronts a range never routes that range into the tunnel, and a
    # private member keeps its own provider block on the provider network.
    allowed_ips: "{{ spoke.tunnel_cidrs + (lab.range_cidrs | difference(spoke.hub_routes)) + (['0.0.0.0/0'] if spoke.egress_via_hub else []) }}"
    gateway: "{{ groups['gateway'][0] }}"
  tasks:
    # A re-joined host may have no working route until the tunnel is back
    # (a LUDUS host's native gateway is the lab hub), so only a missing
    # package is worth a package-list refresh.
    - name: See whether the WireGuard tools are already present
      ansible.builtin.command: dpkg -s wireguard-tools ufw
      register: wg_tools
      changed_when: false
      failed_when: false

    - name: Install WireGuard tools
      ansible.builtin.apt:
        name: [wireguard-tools, ufw]
        state: present
        update_cache: "{{ wg_tools.rc != 0 }}"
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 15

    - name: Keep the spoke key on this host only
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/spoke.key
      args:
        creates: /etc/wireguard/spoke.key

    - name: Read the spoke keys
      ansible.builtin.shell: wg pubkey < /etc/wireguard/spoke.key && cat /etc/wireguard/spoke.key
      register: spoke_keys
      changed_when: false
      no_log: true

    - name: Read the hub public key
      ansible.builtin.command: cat /etc/wireguard/hub.pub
      delegate_to: "{{ gateway }}"
      register: hub_public
      changed_when: false

    - name: Register this spoke on the hub
      ansible.builtin.blockinfile:
        path: /etc/wireguard/wg0.conf
        marker: "# {mark} c2itall member {{ spoke.deployment_id }}"
        block: |
          [Peer]
          PublicKey = {{ spoke_keys.stdout_lines[0] }}
          AllowedIPs = {{ ([spoke.lab_ip + '/32'] + spoke.hub_routes) | join(', ') }}
      delegate_to: "{{ gateway }}"

    - name: Apply the hub configuration without dropping other peers
      ansible.builtin.shell: wg syncconf wg0 <(wg-quick strip wg0)
      args:
        executable: /bin/bash
      delegate_to: "{{ gateway }}"
      changed_when: false

    # The main table keeps the provider's routes even once wg-quick owns the
    # default route (its 0.0.0.0/0 lives in table 51820), so a re-join sees the
    # same answer; the longest match also covers a hub that is on-link (local labs).
    - name: Work out how this host reaches the hub outside the tunnel
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress, subprocess, sys
            hub = ipaddress.ip_address(sys.argv[1])
            best = None
            for line in subprocess.run(['ip', '-4', 'route', 'show', 'table', 'main'],
                                       capture_output=True, text=True, check=True).stdout.splitlines():
                words = line.split()
                try:
                    network = ipaddress.ip_network('0.0.0.0/0' if words[0] == 'default' else words[0], strict=False)
                except ValueError:
                    continue
                if hub in network and (best is None or network.prefixlen > best[0].prefixlen):
                    best = (network, words)
            out = []
            for key in ('via', 'dev'):
                if key in best[1]:
                    out += [key, best[1][best[1].index(key) + 1]]
            print(' '.join(out))
          - "{{ lab.hub.public_ip }}"
      register: hub_route
      changed_when: false

    - name: Write the spoke configuration
      ansible.builtin.template:
        src: templates/spoke.conf.j2
        dest: /etc/wireguard/lab0.conf
        mode: '0600'
      register: spoke_conf
      no_log: true

    - name: Bring the tunnel up
      ansible.builtin.systemd:
        name: wg-quick@lab0
        enabled: true
        state: "{{ 'restarted' if spoke_conf.changed else 'started' }}"

    - name: Admit lab traffic arriving through the tunnel
      ansible.builtin.command: ufw allow in on lab0 from {{ item }}
      loop: "{{ lab.cidrs + lab.range_cidrs }}"
      changed_when: false
      failed_when: false

    - name: Wait for the hub handshake
      ansible.builtin.shell: wg show lab0 latest-handshakes | awk '{print $2}' | grep -vqx 0
      register: handshake
      until: handshake.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Reach the hub through the tunnel
      ansible.builtin.command: ping -c 2 -W 3 {{ lab.hub.lab_ip }}
      changed_when: false
