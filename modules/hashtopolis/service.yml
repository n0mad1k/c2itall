---
- name: Wait for the Hashtopolis server
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the Hashtopolis server
  hosts: hashtopolis
  become: true
  gather_facts: true
  tasks:
    - name: Validate the Hashtopolis route inputs
      ansible.builtin.assert:
        that:
          - provider_workload == 'hashtopolis'
          - operator_ip | length > 0
          - hashtopolis_ip | length > 0
        fail_msg: Hashtopolis requires the operator and server addresses

    - name: Wait for the host to finish first boot
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install Hashtopolis
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/configure_hashtopolis.yml"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "Hashtopolis ready: https://{{ hashtopolis_host }}/ (user {{ hashtopolis_admin_user }}; password is HASHTOPOLIS_ADMIN_PASSWORD in /opt/hashtopolis/.env on the host)"
          - "Agents register at https://{{ hashtopolis_host }}/api/server.php from: {{ ([operator_ip] + (hashtopolis_agent_sources | default([]))) | join(', ') }}"
  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
