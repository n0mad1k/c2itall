---
- name: Wait for the logging server
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the logging server
  hosts: logservers
  become: true
  gather_facts: true
  tasks:
    - name: Validate the logging server route inputs
      ansible.builtin.assert:
        that:
          - provider_workload == 'logging_server'
          - operator_ip | length > 0
          - logging_server_ip | length > 0
        fail_msg: Logging server requires the operator and server addresses

    - name: Wait for the host to finish first boot
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Install RedELK
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/configure_logging_server.yml"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "RedELK server ready: https://{{ inventory_hostname }}/ (user redelk; password is CREDS_redelk in /opt/redelk-elk/elkserver/.env on the host)"
          - "Beats ingest on 5044 is open to: {{ logging_ingest_sources | default([]) | join(', ') or 'nobody yet' }}"
          - "Onboarding packages stay on the host: /opt/redelk/redirs.tgz and /opt/redelk/c2servers.tgz"
          - "No redirector or C2 server ships logs until you install those packages there"
