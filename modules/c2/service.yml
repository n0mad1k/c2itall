---
- name: Wait for the C2 server
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the C2 server
  hosts: c2servers
  become: true
  gather_facts: true
  tasks:
    - name: Validate the C2 route inputs
      ansible.builtin.assert:
        that:
          - provider_workload == 'c2'
          - c2_framework_tasks is defined
          - lab is defined or domain | length > 0
          - ansible_facts['distribution'] is search('Kali')
        fail_msg: C2 requires a domain (or a lab), a native framework and a Kali image

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Wait for package manager locks to clear
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 5; done
      changed_when: false

    # Kali rotated its archive signing key in 2025; older images cannot update without it
    - name: Refresh the Kali archive keyring
      ansible.builtin.get_url:
        url: https://archive.kali.org/archive-keyring.gpg
        dest: /usr/share/keyrings/kali-archive-keyring.gpg
        mode: '0644'
        force: yes

    - name: Wait for apt to be available
      ansible.builtin.apt:
        update_cache: yes
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10

    - name: Install the shared offensive toolset
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/tasks/install_tools.yml"

    - name: Configure the selected C2 framework
      ansible.builtin.include_tasks: "{{ playbook_dir }}/{{ c2_framework_tasks }}"

    - name: Configure the mail stack
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/tasks/configure_mail.yml"
      when: lab is not defined

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "C2 Server Deployment Complete!"
          - "C2 Server IP: {{ inventory_hostname }}"
          - "C2 Server Domain: {{ domain }}"
          - "GoPhish Admin Port: {{ gophish_admin_port | default('2222') }}"
