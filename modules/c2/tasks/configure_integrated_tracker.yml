---
# Common task for configuring integrated email tracker on C2 server

- name: Check if integrated tracker setup is requested
  debug:
    msg: "Setting up integrated email tracker on C2 server"
  when: setup_integrated_tracker | default(false) | bool

- name: Install required packages for tracker
  apt:
    name:
      - python3-pip
      - python3-venv
      - python3-pillow
      - nginx
      - certbot
      - python3-certbot-nginx
      - jq
    state: present
    update_cache: yes
  when: setup_integrated_tracker | default(false) | bool

- name: Settle tracker locations
  set_fact:
    tracker_home: /opt/tracker
    tracker_bind: 127.0.0.1
    tracker_domain: "{{ tracker_domain | default('track.' + domain) }}"

- name: Create tracker system user
  user:
    name: tracker
    system: yes
    shell: /usr/sbin/nologin
    home: "{{ tracker_home }}"
    create_home: no
  when: setup_integrated_tracker | default(false) | bool

- name: Create tracker directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: tracker
    group: tracker
  loop:
    - "{{ tracker_home }}"
    - "{{ tracker_home }}/data"
  when: setup_integrated_tracker | default(false) | bool

- name: Create Python virtual environment for tracker
  pip:
    virtualenv: "{{ tracker_home }}/venv"
    name:
      - flask
      - pillow
      - gunicorn
    virtualenv_command: /usr/bin/python3 -m venv
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when: setup_integrated_tracker | default(false) | bool

- name: Install tracker application code
  template:
    src: "../../tracker/templates/simple_email_tracker.py.j2"
    dest: "{{ tracker_home }}/simple_email_tracker.py"
    mode: '0750'
    owner: tracker
    group: tracker
  when: setup_integrated_tracker | default(false) | bool

- name: Install systemd service file for tracker
  template:
    src: "../../tracker/templates/tracker.service.j2"
    dest: /etc/systemd/system/tracker.service
    mode: '0644'
    owner: root
    group: root
  when: setup_integrated_tracker | default(false) | bool

- name: Create certificate directory for tracker
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0700'
  when: setup_integrated_tracker | default(false) | bool

- name: Generate a self-signed certificate for tracker
  command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:2048 -days 365
      -subj "/CN={{ tracker_domain }}"
      -keyout /etc/nginx/ssl/tracker.key -out /etc/nginx/ssl/tracker.crt
    creates: /etc/nginx/ssl/tracker.crt
  when: setup_integrated_tracker | default(false) | bool

- name: Set up SSL if requested
  shell: |
    certbot --nginx -d {{ tracker_domain }} --non-interactive --agree-tos -m {{ tracker_email | default(letsencrypt_email) | default('admin@' + domain) }}
  args:
    creates: /etc/letsencrypt/live/{{ tracker_domain }}/fullchain.pem
  when: setup_integrated_tracker | default(false) | bool and tracker_setup_ssl | default(true) | bool
  ignore_errors: yes

- name: Check for a Let's Encrypt certificate
  stat:
    path: "/etc/letsencrypt/live/{{ tracker_domain }}/fullchain.pem"
  register: tracker_letsencrypt
  when: setup_integrated_tracker | default(false) | bool

- name: Select the certificate the tracker site serves
  set_fact:
    tracker_cert: "{{ tracker_letsencrypt.stat.exists | ternary('/etc/letsencrypt/live/' ~ tracker_domain ~ '/fullchain.pem', '/etc/nginx/ssl/tracker.crt') }}"
    tracker_key: "{{ tracker_letsencrypt.stat.exists | ternary('/etc/letsencrypt/live/' ~ tracker_domain ~ '/privkey.pem', '/etc/nginx/ssl/tracker.key') }}"
  when: setup_integrated_tracker | default(false) | bool

- name: Create NGINX site config for tracker
  template:
    src: "../../tracker/templates/tracker-nginx.conf.j2"
    dest: /etc/nginx/sites-available/tracker
    mode: '0644'
    owner: root
    group: root
  when: setup_integrated_tracker | default(false) | bool

- name: Enable tracker NGINX site
  file:
    src: /etc/nginx/sites-available/tracker
    dest: /etc/nginx/sites-enabled/tracker
    state: link
  when: setup_integrated_tracker | default(false) | bool

- name: Start and enable tracker service
  systemd:
    name: tracker
    state: started
    enabled: yes
    daemon_reload: yes
  when: setup_integrated_tracker | default(false) | bool

- name: Reload nginx with the tracker site
  service:
    name: nginx
    state: reloaded
  when: setup_integrated_tracker | default(false) | bool
