---
- name: Read the lab environment file
  ansible.builtin.slurp:
    src: /root/.ludus-lab.env
  register: ludus_env_raw
  no_log: true

- name: Extract the lab API key and range number
  ansible.builtin.set_fact:
    ludus_lab_api_key: "{{ (ludus_env_raw.content | b64decode) | regex_search('LUDUS_API_KEY=(.*)', '\\1') | first }}"
    ludus_range_number_fact: "{{ (ludus_env_raw.content | b64decode) | regex_search('LAB_RANGE_NUMBER=(.*)', '\\1') | first }}"
  no_log: true

- name: Copy the dataset generator to the host
  ansible.builtin.copy:
    src: files/make_datasets.py
    dest: /opt/ludus-lab/make_datasets.py
    mode: '0755'

- name: Generate the lab datasets (creates-guarded)
  ansible.builtin.command: python3 /opt/ludus-lab/make_datasets.py --all --out /srv/lab-datasets
  args:
    creates: /srv/lab-datasets/manifest-large.json

- name: Install the lab datasets service
  ansible.builtin.copy:
    dest: /etc/systemd/system/lab-datasets.service
    mode: '0644'
    content: |
      [Unit]
      Description=c2itall lab datasets
      # ponytail: fake data, deliberately unrestricted inside the lab
      After=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/srv/lab-datasets
      ExecStart=/usr/bin/python3 -m http.server 8000
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: Start the lab datasets service
  ansible.builtin.systemd:
    name: lab-datasets
    enabled: true
    state: started
    daemon_reload: true

- name: Disable ufw (Proxmox and LUDUS own iptables on this host)
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false

- name: Install the lab routing script
  ansible.builtin.template:
    src: templates/lab-routing.sh.j2
    dest: /usr/local/sbin/lab-routing.sh
    mode: '0700'
  notify: apply lab routing

- name: Install the lab routing unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/lab-routing.service
    mode: '0644'
    content: |
      [Unit]
      Description=c2itall LUDUS host: scope the admin API and range/lab forwarding
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/lab-routing.sh

      [Install]
      WantedBy=multi-user.target

- name: Start the lab routing unit
  ansible.builtin.systemd:
    name: lab-routing
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# ponytail: templates never rebuild automatically after this; `ludus templates
# build -f` by hand if an image needs refreshing.
- name: Kick off the range template builds without waiting (once)
  ansible.builtin.shell: |
    touch /opt/ludus-lab/.templates-build-started
    setsid nohup ludus templates build -n win2022-server-x64-template,win11-22h2-x64-enterprise-template -p {{ 1 if lab_range == 'mini' else 2 }} --url https://127.0.0.1:8080 >templates-build.log 2>&1 < /dev/null &
  args:
    chdir: /opt/ludus-lab
    executable: /bin/bash
    creates: /opt/ludus-lab/.templates-build-started
  environment:
    LUDUS_API_KEY: "{{ ludus_lab_api_key }}"
  changed_when: true

- name: Print the LUDUS host summary
  ansible.builtin.debug:
    msg:
      - "Range number: {{ ludus_range_number_fact }}"
      - "Datasets: http://{{ ludus_host_ip }}:8000"
