---
# LUDUS 2.3.10 (gitlab.com/badsectorlabs/ludus, released 2026-10-23). Release asset
# and checksum verified directly against the GitLab generic package registry and the
# published ludus_2.3.10_checksums.txt; `--no-prompt` and the config.yml keys below
# were verified against the ludus-server Go source (args.go, config.go, checks.go)
# since docs.ludus.cloud/docs/quick-start/install-ludus does not document the
# unattended flag. /opt/ludus/install/root-api-key and the "Ludus install completed
# successfully" / .stage-3-complete marker were verified against
# ludus-install-status.sh.j2 in the same source tree. Both binaries and their
# sha256 come from ludus_2.3.10_checksums.txt in the package registry.
- name: Check whether this host already serves the lab
  ansible.builtin.stat:
    path: /root/.ludus-lab.env
  register: ludus_lab_env

- name: Check whether LUDUS is already installed
  ansible.builtin.stat:
    path: /opt/ludus/install/root-api-key
  register: ludus_installed

# A host that finished the install but never got its lab user (an interrupted
# run) picks up at the user step; a host that has both is left alone.
- name: Install LUDUS and create the lab user
  when: not ludus_lab_env.stat.exists
  vars:
    ludus_server_url: https://gitlab.com/api/v4/projects/54052321/packages/generic/ludus/2.3.10/ludus-server-2.3.10
    ludus_server_sha256: 544c3227fbe4c0772821bac68636997a0b18964efe11ab71b3218f6c4b78c7d9
    ludus_client_url: https://gitlab.com/api/v4/projects/54052321/packages/generic/ludus/2.3.10/ludus-client_linux-amd64-2.3.10
    ludus_client_sha256: 5bc6021744acd0753a520f2c98e593190d329bdc4ea43e6413aefcd926c1af79
  block:
    - name: Preflight checks and the unattended LUDUS install
      when: not ludus_installed.stat.exists
      block:
        - name: Require Debian 12 or 13 on x86_64
          ansible.builtin.assert:
            that:
              - ansible_facts.distribution == 'Debian'
              - ansible_facts.distribution_major_version in ['12', '13']
              - ansible_facts.architecture == 'x86_64'
            fail_msg: "LUDUS needs Debian 12 or 13 on x86_64 (found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }} {{ ansible_facts.architecture }})"

        - name: Require CPU virtualization support (vmx or svm)
          ansible.builtin.command: grep -Eq 'vmx|svm' /proc/cpuinfo
          changed_when: false

        - name: Collect installed package facts
          ansible.builtin.package_facts:

        - name: Refuse a host with Docker installed
          ansible.builtin.assert:
            that:
              - "'docker-ce' not in ansible_facts.packages"
              - "'docker.io' not in ansible_facts.packages"
            fail_msg: LUDUS does not support a host that already has Docker installed

        - name: Require enough RAM for this range size
          ansible.builtin.assert:
            # ponytail: 1 GB slack for firmware-reserved memory vs. the nominal GB figure.
            that: ansible_facts.memtotal_mb >= ((ludus_min_ram_gb | int) * 1024) - 1024
            fail_msg: "{{ lab_range }} needs at least {{ ludus_min_ram_gb }} GB RAM (found {{ (ansible_facts.memtotal_mb / 1024) | round(1) }} GB)"

        - name: Work out free space on /
          ansible.builtin.set_fact:
            ludus_root_free_gb: "{{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first).size_available // (1024 * 1024 * 1024) }}"

        - name: Require at least 120 GB free on /
          ansible.builtin.assert:
            that: ludus_root_free_gb | int >= 120
            fail_msg: "Needs at least 120 GB free on / (found {{ ludus_root_free_gb }} GB)"

        - name: Make the install staging directory
          ansible.builtin.file:
            path: /opt/ludus-lab-bootstrap
            state: directory
            mode: '0700'

        - name: Fetch the pinned ludus-server release binary
          ansible.builtin.get_url:
            url: "{{ ludus_server_url }}"
            dest: /opt/ludus-lab-bootstrap/ludus-server
            checksum: "sha256:{{ ludus_server_sha256 }}"
            mode: '0755'

        - name: Generate the config database encryption key
          # LUDUS wants exactly 32 characters: 16 random bytes as hex.
          ansible.builtin.command: openssl rand -hex 16
          register: ludus_db_key
          changed_when: false
          no_log: true

        - name: Work out which 10.x range numbers are already taken
          ansible.builtin.set_fact:
            ludus_reserved_ranges: >-
              {{ ((lab.blocked_cidrs | default([])) + (lab.range_cidrs | default([])))
                 | select('match', '^10\.') | map('regex_replace', '^10\.(\d+)\..*$', '\1')
                 | map('int') | unique | list }}

        # The spoke already owns the default route, so the Proxmox bridge must be
        # described from the interface that carries the management address instead.
        - name: Describe the interface that carries the management address
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import ipaddress, json, subprocess, sys
                want = sys.argv[1]
                for line in subprocess.run(['ip', '-4', '-o', 'addr', 'show'], capture_output=True, text=True, check=True).stdout.splitlines():
                    words = line.split()
                    if words[3].split('/')[0] == want:
                        iface, cidr = words[1], words[3]
                        break
                else:
                    sys.exit('no interface carries ' + want)
                network = ipaddress.ip_interface(cidr).network
                gateway = str(network[1])
                for line in subprocess.run(['ip', '-4', 'route', 'show', 'default', 'table', 'main', 'dev', iface],
                                           capture_output=True, text=True).stdout.splitlines():
                    words = line.split()
                    if 'via' in words:
                        gateway = words[words.index('via') + 1]
                print(json.dumps({'interface': iface, 'netmask': str(network.netmask), 'gateway': gateway}))
              - "{{ inventory_hostname }}"
          register: ludus_mgmt_raw
          changed_when: false

        - name: Write the LUDUS server config
          vars:
            ludus_mgmt: "{{ ludus_mgmt_raw.stdout | from_json }}"
          ansible.builtin.template:
            src: templates/ludus-config.yml.j2
            dest: /opt/ludus-lab-bootstrap/config.yml
            mode: '0600'
          no_log: true

        - name: Start the unattended install, detached from this SSH session
          ansible.builtin.shell: setsid nohup ./ludus-server --no-prompt >install.log 2>&1 < /dev/null &
          args:
            chdir: /opt/ludus-lab-bootstrap
            executable: /bin/bash

        # The installer reboots the host up to three times; an `until` loop dies on
        # the first unreachable attempt, so the wait recurses round by round instead.
        - name: Start the install wait counter
          ansible.builtin.set_fact:
            ludus_wait_rounds: 0

        - name: Wait for the install to finish across its reboots
          ansible.builtin.include_tasks: wait_install.yml

    # The server install leaves no client on the host (verified live).
    - name: Fetch the pinned ludus client
      ansible.builtin.get_url:
        url: "{{ ludus_client_url }}"
        dest: /usr/local/bin/ludus
        checksum: "sha256:{{ ludus_client_sha256 }}"
        mode: '0755'

    - name: Read the root API key
      ansible.builtin.slurp:
        src: /opt/ludus/install/root-api-key
      register: ludus_root_key_raw
      no_log: true

    - name: Generate the lab user's LUDUS password
      ansible.builtin.command: openssl rand -base64 24
      register: ludus_lab_user_password
      changed_when: false
      no_log: true

    - name: Create the lab API user
      ansible.builtin.command:
        argv:
          - ludus
          - user
          - add
          - --name
          - Lab
          # Not "lab": LUDUS creates a PAM account per user and a local VM's install user may own that name.
          - --userid
          - c2lab
          - --email
          - lab@lab.internal
          - --password
          - "{{ ludus_lab_user_password.stdout }}"
          - --json
          - --url
          - https://127.0.0.1:8081
      environment:
        LUDUS_API_KEY: "{{ (ludus_root_key_raw.content | b64decode).strip() }}"
      register: ludus_user_add
      changed_when: true
      # The client prints the server's error on stderr and exits 0 under --json.
      failed_when: "'apiKey' not in ludus_user_add.stdout"
      no_log: true

    - name: Record the lab user's API key
      ansible.builtin.set_fact:
        ludus_lab_api_key: "{{ (ludus_user_add.stdout | from_json).apiKey }}"
      no_log: true

    - name: List the lab user's default range
      ansible.builtin.command:
        argv: [ludus, range, list, --json, --url, 'https://127.0.0.1:8080']
      environment:
        LUDUS_API_KEY: "{{ ludus_lab_api_key }}"
      register: ludus_range_list
      changed_when: false
      no_log: true

    - name: Work out the range number LUDUS assigned
      ansible.builtin.set_fact:
        ludus_range_number: "{{ (ludus_range_list.stdout | from_json).rangeNumber }}"

    - name: Write the lab environment file (the API key never leaves this file)
      ansible.builtin.copy:
        dest: /root/.ludus-lab.env
        mode: '0600'
        content: |
          LUDUS_API_KEY={{ ludus_lab_api_key }}
          LUDUS_URL=https://127.0.0.1:8080
          LAB_RANGE_NUMBER={{ ludus_range_number }}
      no_log: true

    - name: Add the Ansible collections the Windows roles need
      ansible.builtin.command:
        argv: [ludus, ansible, collection, add, "{{ item }}", --url, 'https://127.0.0.1:8080']
      environment:
        LUDUS_API_KEY: "{{ ludus_lab_api_key }}"
      loop: [microsoft.ad, community.windows]
      changed_when: true
      no_log: true

    - name: Copy this lab's roles to the host
      ansible.builtin.copy:
        src: roles/
        dest: /opt/ludus-lab/roles/
        mode: '0755'

    - name: Copy the Falcon installer into its role when one was given
      ansible.builtin.copy:
        src: "{{ falcon_installer_path }}"
        dest: /opt/ludus-lab/roles/lab_falcon/files/WindowsSensor.exe
        mode: '0644'
      when: falcon_installer_path is defined and falcon_installer_path

    # ponytail: roles register once, at first install; a role edit needs a manual
    # `ludus ansible role add -d ... -f` on the host until this gets an update path.
    - name: Register each role with LUDUS
      ansible.builtin.command:
        argv: [ludus, ansible, role, add, -d, "/opt/ludus-lab/roles/{{ item }}", --url, 'https://127.0.0.1:8080']
      environment:
        LUDUS_API_KEY: "{{ ludus_lab_api_key }}"
      loop: [lab_ad_seed, lab_host, lab_falcon, lab_implant, lab_verify]
      changed_when: true
      no_log: true
