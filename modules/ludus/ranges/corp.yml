# Static shape of the 'corp' range; render.py fills defaults, global_role_vars,
# network.always_blocked_networks and router.iptables_commands at render time.
ludus:
  - vm_name: DC01
    hostname: DC01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 8
    cpus: 4
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: primary-dc}
    roles: [lab_ad_seed, lab_falcon]
  - vm_name: WS01
    hostname: WS01
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
      autologon_user: __ad_domain_user__
      autologon_password: __ad_domain_user_password__
      chocolatey_packages: [rclone, s5cmd, filezilla, cyberduck]
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_verify, lab_falcon]
  - vm_name: WS02
    hostname: WS02
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 8
    cpus: 4
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_falcon]
  - vm_name: FS01
    hostname: FS01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 13
    ram_gb: 4
    cpus: 2
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_falcon]
  - vm_name: APP01
    hostname: APP01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 14
    ram_gb: 4
    cpus: 2
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_falcon]
  - vm_name: BK01
    hostname: BK01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 15
    ram_gb: 4
    cpus: 2
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_falcon]
  - vm_name: MGMT01
    hostname: MGMT01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 16
    ram_gb: 4
    ram_min_gb: 1
    cpus: 2
    windows: {sysprep: true}
    domain: {fqdn: lab.internal, role: member}
    roles: [lab_host, lab_falcon]

network:
  inter_vlan_default: ACCEPT
  external_default: ACCEPT
  wireguard_vlan_default: REJECT

router:
  iptables_commands: []
