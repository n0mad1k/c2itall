---
- name: Wait for the LUDUS host
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Install LUDUS
  hosts: ludushosts
  become: true
  tasks:
    - name: Validate the LUDUS inputs
      ansible.builtin.assert:
        that:
          - lab is defined
          - lab.member is not none
        fail_msg: "The LUDUS play needs its lab membership"

    - name: Install the host
      ansible.builtin.include_tasks: tasks/install.yml
