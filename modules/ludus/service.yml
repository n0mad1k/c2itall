---
- name: Wait for the LUDUS host
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Install LUDUS and build the lab's AD range host
  hosts: ludushosts
  become: true
  tasks:
    - name: Validate the LUDUS inputs
      ansible.builtin.assert:
        that:
          - lab is defined
          - lab.member is not none
          - lab_range in ['corp', 'mini']
        fail_msg: "The LUDUS play needs its lab membership and a valid lab_range"

    - name: Install the host
      ansible.builtin.include_tasks: tasks/install.yml

    - name: Configure the lab host (datasets, routing, template builds)
      ansible.builtin.include_tasks: tasks/lab_host.yml
  handlers:
    - name: apply lab routing
      ansible.builtin.command: /usr/local/sbin/lab-routing.sh
      changed_when: false
