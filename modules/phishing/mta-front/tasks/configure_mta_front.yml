---
# MTA front: an authenticated submission relay for the GoPhish server.
# Postfix, Dovecot SASL and OpenDKIM come from the shared mail tasks.

- name: Install MTA packages
  apt:
    name:
      - postfix
      - postfix-pcre
      - dovecot-core
      - opendkim
      - opendkim-tools
      - swaks
      - dnsutils
      - ufw
    state: present
    update_cache: yes
  register: mta_packages
  until: mta_packages is success
  retries: 5
  delay: 10

- name: Configure Postfix, Dovecot SASL and OpenDKIM
  include_tasks: ../../../../common/tasks/configure_mail.yml

- name: Name the relay and bind SASL to Dovecot
  lineinfile:
    path: /etc/postfix/main.cf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^myhostname', line: "myhostname = {{ mta_hostname | default('mail.' + domain) }}" }
    - { regexp: '^smtpd_sasl_type', line: "smtpd_sasl_type = dovecot" }
    - { regexp: '^smtpd_sasl_path', line: "smtpd_sasl_path = private/auth" }
    - { regexp: '^smtpd_sasl_security_options', line: "smtpd_sasl_security_options = noanonymous" }
    - { regexp: '^smtpd_forbid_bare_newline', line: "smtpd_forbid_bare_newline = yes" }
    - { regexp: '^smtpd_helo_required', line: "smtpd_helo_required = yes" }

- name: Restart Postfix with the relay settings
  service:
    name: postfix
    state: restarted

- name: Allow SMTP and submission through the host firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "25"
    - "587"

- name: Record the relay settings for the operator
  copy:
    dest: /root/MTA_FRONT_GUIDE.txt
    mode: '0600'
    content: |
      MTA front for {{ domain }}
      Submission: {{ ansible_host }}:587 (STARTTLS, SASL user {{ smtp_auth_user }})
      The SASL password was shown in the deployment output.
      DKIM selector "mail": publish /etc/opendkim/keys/{{ domain }}/mail.txt in DNS.
