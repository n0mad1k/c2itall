---
# GoPhish server: pinned release, unprivileged service, TLS admin UI for the operator.

- name: Install GoPhish prerequisites
  apt:
    name:
      - unzip
      - curl
      - openssl
      - ufw
    state: present
    update_cache: yes
  register: gophish_packages
  until: gophish_packages is success
  retries: 5
  delay: 10

- name: Create the gophish service account
  user:
    name: gophish
    system: yes
    shell: /usr/sbin/nologin
    home: /opt/gophish
    create_home: yes

- name: Download the pinned GoPhish release
  get_url:
    url: https://github.com/gophish/gophish/releases/download/v0.12.1/gophish-v0.12.1-linux-64bit.zip
    dest: /opt/gophish/gophish.zip
    mode: '0644'
  register: gophish_download
  until: gophish_download is success
  retries: 3
  delay: 10

- name: Extract GoPhish
  unarchive:
    src: /opt/gophish/gophish.zip
    dest: /opt/gophish
    remote_src: yes
    owner: gophish
    group: gophish
    creates: /opt/gophish/gophish

- name: Make the GoPhish binary executable
  file:
    path: /opt/gophish/gophish
    mode: '0755'
    owner: gophish
    group: gophish

- name: Check for a Let's Encrypt certificate
  stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: gophish_le_cert

- name: Issue a self-signed certificate for the admin UI
  command:
    cmd: >
      openssl req -x509 -newkey rsa:2048 -nodes -days 365
      -subj "/CN={{ phishing_hostname | default(domain) }}"
      -keyout /opt/gophish/admin-key.pem -out /opt/gophish/admin-cert.pem
    creates: /opt/gophish/admin-cert.pem
  when: not gophish_le_cert.stat.exists

- name: Protect the admin certificate
  file:
    path: "{{ item }}"
    owner: gophish
    group: gophish
    mode: '0600'
  loop:
    - /opt/gophish/admin-key.pem
    - /opt/gophish/admin-cert.pem
  when: not gophish_le_cert.stat.exists

- name: Write the GoPhish configuration
  template:
    src: ../templates/gophish-config.j2
    dest: /opt/gophish/config.json
    owner: gophish
    group: gophish
    mode: '0600'
  vars:
    gophish_admin_cert: "{{ '/etc/letsencrypt/live/' + domain + '/fullchain.pem' if gophish_le_cert.stat.exists else '/opt/gophish/admin-cert.pem' }}"
    gophish_admin_key: "{{ '/etc/letsencrypt/live/' + domain + '/privkey.pem' if gophish_le_cert.stat.exists else '/opt/gophish/admin-key.pem' }}"
    gophish_listen_port: "{{ gophish_phish_port | default(80) }}"

- name: Install the GoPhish service
  copy:
    dest: /etc/systemd/system/gophish.service
    mode: '0644'
    content: |
      [Unit]
      Description=GoPhish
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=gophish
      Group=gophish
      WorkingDirectory=/opt/gophish
      ExecStart=/opt/gophish/gophish
      Restart=on-failure
      AmbientCapabilities=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target

- name: Start GoPhish
  systemd:
    name: gophish
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Allow the phishing listener from anywhere
  community.general.ufw:
    rule: allow
    port: "{{ gophish_phish_port | default(80) }}"
    proto: tcp
  when: provider | default('') != 'aws'

- name: Allow the admin UI only from the operator
  community.general.ufw:
    rule: allow
    port: "{{ gophish_admin_port | default(3333) }}"
    proto: tcp
    src: "{{ operator_ip }}"
  when: provider | default('') != 'aws'

- name: Record how to reach GoPhish
  copy:
    dest: /root/GOPHISH_GUIDE.txt
    mode: '0600'
    content: |
      GoPhish admin: https://{{ ansible_host }}:{{ gophish_admin_port | default(3333) }}/ (operator IP only)
      Initial admin password: journalctl -u gophish | grep 'Please login'
      Sending profile: host {{ mta_ip | default('<MTA front>') }}:587, STARTTLS,
      user {{ smtp_auth_user | default('admin') }}, ignore certificate errors until DNS and TLS are issued.
