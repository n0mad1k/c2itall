---
- name: Wait for the exfil receiver
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Configure the exfil receiver
  hosts: all
  become: true
  tasks:
    - name: Validate the receiver inputs
      ansible.builtin.assert:
        that:
          - lab is defined
          - lab.member is not none
          - exfil_minio_user | default('') | length > 0
          - exfil_minio_password | default('') | length > 0
          - exfil_http_user | default('') | length > 0
          - exfil_http_password | default('') | length > 0
          - exfil_sftp_password | default('') | length > 0
        fail_msg: "The exfil receiver play needs its lab membership and generated credentials"

    - name: Configure the drop points
      ansible.builtin.include_tasks: tasks/configure_exfil.yml
