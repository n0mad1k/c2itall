---
- name: Wait for the redirector
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the redirector
  hosts: redirectors
  become: true
  gather_facts: true
  tasks:
    - name: Validate the redirector route inputs
      ansible.builtin.assert:
        that:
          - provider_workload == 'redirector'
          - domain | length > 0
          - c2_ip | length > 0
        fail_msg: Redirector requires a domain and a backend address

    - name: Configure the redirector service
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/configure_redirector.yml"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "Redirector Deployment Complete!"
          - "Redirector IP: {{ inventory_hostname }}"
          - "Redirector Domain: {{ redirector_subdomain | default('cdn') }}.{{ domain }} (Update DNS A record)"
          - "{{ ('Public entry point: https://' ~ edge_hostname ~ '/ (origin answers the edge only)') if edge_hostname | default('') else 'Origin answers the public internet directly' }}"
