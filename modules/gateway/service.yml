---
- name: Wait for the lab gateway
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Configure the lab gateway
  hosts: all
  become: true
  tasks:
    - name: Validate the gateway inputs
      ansible.builtin.assert:
        that:
          - lab is defined
          - lab.hub.public_ip | length > 0
          - operator_ip | length > 0
        fail_msg: "The gateway play needs the lab record and the operator address"

    - name: Configure the hub
      ansible.builtin.include_tasks: tasks/configure_gateway.yml
  handlers:
    - name: apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: apply hub firewall
      ansible.builtin.command: /usr/local/sbin/lab-hub-fw
      changed_when: false

    - name: restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
