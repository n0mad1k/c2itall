---
# WEBRUNNER — Distributed geo-targeted recon
# Multi-provider: Linode, AWS, FlokiNET
# Controller: ~/tools/c2itall/ (CWD when ansible-playbook runs)

- name: WEBRUNNER — Provision scan nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ssh_key_name: "{{ ssh_key_path | basename | regex_replace('\\.pub$', '') }}"
    all_node_chunks: "{{ lookup('file', node_chunks_file) | from_json }}"
    linode_chunks: "{{ all_node_chunks | selectattr('provider', 'equalto', 'linode') | list }}"
    aws_chunks: "{{ all_node_chunks | selectattr('provider', 'equalto', 'aws') | list }}"

  tasks:
    - name: Ensure results directory
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'

    - name: Initialize scanner IP log
      copy:
        content: "# WEBRUNNER scanner IPs — {{ webrunner_name }}\n"
        dest: "{{ scanner_ip_log }}"
        mode: '0644'
        force: false

    # ── Linode — all nodes created in parallel ────────────────────────────────

    - block:
        - name: Generate shared root password
          set_fact:
            wr_root_pass: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

        - name: Read SSH public key
          slurp:
            src: "~/.ssh/{{ ssh_key_name }}.pub"
          register: wr_pubkey

        - name: Register SSH key with Linode
          uri:
            url: "https://api.linode.com/v4/profile/sshkeys"
            method: POST
            headers:
              Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
              Content-Type: "application/json"
            body_format: json
            body:
              label: "{{ webrunner_name }}"
              ssh_key: "{{ wr_pubkey.content | b64decode | trim }}"
            status_code: [200, 201, 422]
          ignore_errors: true

        - name: Fire all Linode instance creates
          uri:
            url: "https://api.linode.com/v4/linode/instances"
            method: POST
            headers:
              Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
              Content-Type: "application/json"
            body_format: json
            body:
              label: "{{ item.node_name }}"
              type: "{{ linode_instance_type | default('g6-nanode-1') }}"
              region: "{{ item.region | default('us-east') }}"
              image: "linode/debian12"
              root_pass: "{{ wr_root_pass }}"
              authorized_keys:
                - "{{ wr_pubkey.content | b64decode | trim }}"
              booted: true
              backups_enabled: false
              private_ip: false
              tags:
                - "webrunner"
                - "{{ webrunner_name }}"
                - "{{ deployment_id }}"
            status_code: [200, 201]
          loop: "{{ linode_chunks }}"
          async: 300
          poll: 0
          register: wr_create_jobs

        - name: Wait for all creates to confirm
          async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ wr_create_jobs.results }}"
          register: wr_create_results
          until: wr_create_results.finished
          retries: 30
          delay: 10

        - name: Add all Linode nodes to inventory
          add_host:
            name: "{{ item.json.ipv4[0] }}"
            groups: webrunner_nodes
            ansible_host: "{{ item.json.ipv4[0] }}"
            ansible_user: root
            ansible_ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
            node_name: "{{ linode_chunks[idx].node_name }}"
            node_cidrs: "{{ linode_chunks[idx].cidrs }}"
            node_ip_count: "{{ linode_chunks[idx].ip_count }}"
            node_idx: "{{ linode_chunks[idx].idx }}"
            linode_instance_id: "{{ item.json.id }}"
            provider: linode
          loop: "{{ wr_create_results.results }}"
          loop_control:
            index_var: idx

        - name: Log scanner IPs
          lineinfile:
            path: "{{ scanner_ip_log }}"
            line: "{{ linode_chunks[idx].node_name }}: {{ item.json.ipv4[0] }}"
            create: true
          loop: "{{ wr_create_results.results }}"
          loop_control:
            index_var: idx

        - name: Show provisioned nodes
          debug:
            msg: "Node ready: {{ linode_chunks[idx].node_name }} @ {{ item.json.ipv4[0] }} ({{ linode_chunks[idx].region }})"
          loop: "{{ wr_create_results.results }}"
          loop_control:
            index_var: idx

      when: linode_chunks | length > 0

    # ── AWS — per-unique-region setup then parallel creates ───────────────────

    - block:
        - name: Read SSH public key for AWS
          slurp:
            src: "~/.ssh/{{ ssh_key_name }}.pub"
          register: aws_pubkey

        - name: Get unique AWS regions
          set_fact:
            aws_unique_regions: "{{ aws_chunks | map(attribute='region') | unique | list }}"

        - name: Import SSH key pair per region
          amazon.aws.ec2_key:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            name: "{{ webrunner_name }}"
            key_material: "{{ aws_pubkey.content | b64decode | trim }}"
            region: "{{ item }}"
            state: present
          loop: "{{ aws_unique_regions }}"

        # Accounts without a default VPC need a deployment-owned network.
        - name: Create a VPC per region
          amazon.aws.ec2_vpc_net:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            name: "wr-{{ deployment_id }}-vpc"
            cidr_block: 10.0.0.0/16
            region: "{{ item }}"
            tags:
              deployment_id: "{{ deployment_id }}"
              webrunner: "{{ webrunner_name }}"
            state: present
          loop: "{{ aws_unique_regions }}"
          register: wr_aws_vpcs

        - name: Attach an internet gateway per region
          amazon.aws.ec2_vpc_igw:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            vpc_id: "{{ item.vpc.id }}"
            region: "{{ item.item }}"
            tags:
              Name: "wr-{{ deployment_id }}-igw"
              deployment_id: "{{ deployment_id }}"
            state: present
          loop: "{{ wr_aws_vpcs.results }}"
          loop_control:
            label: "{{ item.item }}"
          register: wr_aws_igws

        - name: Create a public subnet per region
          amazon.aws.ec2_vpc_subnet:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            vpc_id: "{{ item.vpc.id }}"
            cidr: 10.0.1.0/24
            region: "{{ item.item }}"
            map_public: true
            tags:
              Name: "wr-{{ deployment_id }}-subnet"
              deployment_id: "{{ deployment_id }}"
            state: present
          loop: "{{ wr_aws_vpcs.results }}"
          loop_control:
            label: "{{ item.item }}"
          register: wr_aws_subnets

        - name: Route each subnet to its internet gateway
          amazon.aws.ec2_vpc_route_table:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            vpc_id: "{{ item.0.vpc.id }}"
            region: "{{ item.0.item }}"
            subnets:
              - "{{ item.1.subnet.id }}"
            routes:
              - dest: 0.0.0.0/0
                gateway_id: "{{ item.2.gateway_id }}"
            tags:
              Name: "wr-{{ deployment_id }}-rt"
              deployment_id: "{{ deployment_id }}"
            state: present
          loop: "{{ wr_aws_vpcs.results | zip(wr_aws_subnets.results, wr_aws_igws.results) | list }}"
          loop_control:
            label: "{{ item.0.item }}"

        - name: Map each region to its network
          set_fact:
            wr_aws_networks: "{{ wr_aws_networks | default({}) | combine({item.0.item: {'vpc_id': item.0.vpc.id, 'subnet_id': item.1.subnet.id}}) }}"
          loop: "{{ wr_aws_vpcs.results | zip(wr_aws_subnets.results) | list }}"
          loop_control:
            label: "{{ item.0.item }}"

        - name: Create security group per region
          amazon.aws.ec2_security_group:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            name: "webrunner-{{ webrunner_name }}"
            description: "WEBRUNNER scan node SG"
            vpc_id: "{{ wr_aws_networks[item].vpc_id }}"
            region: "{{ item }}"
            rules:
              - proto: tcp
                ports: [22]
                cidr_ip: "{{ (operator_ip ~ '/32') if operator_ip else '0.0.0.0/0' }}"
            rules_egress:
              - proto: all
                cidr_ip: "0.0.0.0/0"
            tags:
              Name: "webrunner-{{ webrunner_name }}"
              deployment_id: "{{ deployment_id }}"
              webrunner: "{{ webrunner_name }}"
            state: present
          loop: "{{ aws_unique_regions }}"

        - name: Fire all AWS instance creates
          amazon.aws.ec2_instance:
            access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            name: "{{ item.node_name }}"
            instance_type: "{{ aws_instance_type | default('t3.micro') }}"
            region: "{{ item.region }}"
            # Scan nodes run Debian 12 (admin user) on every provider; the shared
            # vars AMI map describes Ubuntu images for the other workloads.
            image_id: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/debian/release/12/latest/amd64', region=item.region) }}"
            key_name: "{{ webrunner_name }}"
            vpc_subnet_id: "{{ wr_aws_networks[item.region].subnet_id }}"
            security_groups:
              - "webrunner-{{ webrunner_name }}"
            network:
              assign_public_ip: true
            tags:
              Name: "{{ item.node_name }}"
              webrunner: "{{ webrunner_name }}"
              deployment_id: "{{ deployment_id }}"
            state: running
            wait: true
            wait_timeout: 300
          loop: "{{ aws_chunks }}"
          async: 600
          poll: 0
          register: aws_create_jobs

        - name: Wait for all AWS creates to confirm
          async_status:
            jid: "{{ item.ansible_job_id }}"
          loop: "{{ aws_create_jobs.results }}"
          register: aws_create_results
          until: aws_create_results.finished
          retries: 60
          delay: 10

        - name: Add all AWS nodes to inventory
          add_host:
            name: "{{ item.instances[0].public_ip_address }}"
            groups: webrunner_nodes
            ansible_host: "{{ item.instances[0].public_ip_address }}"
            ansible_user: admin
            ansible_ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
            ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
            node_name: "{{ aws_chunks[idx].node_name }}"
            node_cidrs: "{{ aws_chunks[idx].cidrs }}"
            node_ip_count: "{{ aws_chunks[idx].ip_count }}"
            node_idx: "{{ aws_chunks[idx].idx }}"
            ec2_instance_id: "{{ item.instances[0].instance_id }}"
            ec2_region: "{{ aws_chunks[idx].region }}"
            provider: aws
          loop: "{{ aws_create_results.results }}"
          loop_control:
            index_var: idx

        - name: Log AWS scanner IPs
          lineinfile:
            path: "{{ scanner_ip_log }}"
            line: "{{ aws_chunks[idx].node_name }}: {{ item.instances[0].public_ip_address }}"
            create: true
          loop: "{{ aws_create_results.results }}"
          loop_control:
            index_var: idx

        - name: Show provisioned AWS nodes
          debug:
            msg: "Node ready: {{ aws_chunks[idx].node_name }} @ {{ item.instances[0].public_ip_address }} ({{ aws_chunks[idx].region }})"
          loop: "{{ aws_create_results.results }}"
          loop_control:
            index_var: idx

      when: aws_chunks | length > 0

    # ── Azure — nodes are provisioned by the registered Azure route before this play ──

    - name: Require the Azure route to have provisioned every Azure node
      assert:
        that:
          - (azure_nodes | default([]) | length) == (all_node_chunks | selectattr('provider', 'equalto', 'azure') | list | length)
        fail_msg: "Azure WEBRUNNER nodes must be provisioned by the registered Azure route"

    - name: Add pre-provisioned Azure nodes to inventory
      add_host:
        name: "{{ item.ip }}"
        groups: webrunner_nodes
        ansible_host: "{{ item.ip }}"
        ansible_user: azureuser
        ansible_ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        node_name: "{{ item.node_name }}"
        node_cidrs: "{{ item.cidrs }}"
        node_ip_count: "{{ item.ip_count }}"
        node_idx: "{{ item.idx }}"
        azure_deployment_id: "{{ item.deployment_id }}"
        provider: azure
      loop: "{{ azure_nodes | default([]) }}"
      loop_control:
        label: "{{ item.node_name }}"

    - name: Log Azure scanner IPs
      lineinfile:
        path: "{{ scanner_ip_log }}"
        line: "{{ item.node_name }}: {{ item.ip }}"
        create: true
      loop: "{{ azure_nodes | default([]) }}"
      loop_control:
        label: "{{ item.node_name }}"

    # ── FlokiNET ──────────────────────────────────────────────────────────────

    - name: Provision FlokiNET nodes
      include_tasks: "FlokiNET/webrunner_provision_tasks.yml"
      loop: "{{ all_node_chunks | selectattr('provider', 'equalto', 'flokinet') | list }}"
      loop_control:
        loop_var: node_chunk


- name: WEBRUNNER — Configure and scan
  hosts: webrunner_nodes
  gather_facts: false
  become: true
  strategy: free

  tasks:
    - name: Wait for SSH
      wait_for_connection:
        delay: 20
        timeout: 300

    - name: Configure node
      include_tasks: "{{ playbook_dir }}/../modules/webrunner/tasks/configure_node.yml"

    - name: Run scan
      include_tasks: "{{ playbook_dir }}/../modules/webrunner/tasks/run_scan.yml"

    - name: Collect results
      include_tasks: "{{ playbook_dir }}/../modules/webrunner/tasks/collect_results.yml"


- name: WEBRUNNER — Merge and report
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Merge per-node results
      command: >
        python3 {{ playbook_dir }}/../modules/webrunner/tasks/merge_results.py
        --results-dir {{ results_dir }}
        --output {{ results_dir }}/merged_results.json
        --deployment-id {{ deployment_id }}
      register: merge_out
      ignore_errors: true

    - name: Show merge output
      debug:
        var: merge_out.stdout_lines
      when: merge_out.stdout_lines is defined and merge_out.stdout_lines | length > 0

    - name: Summary
      debug:
        msg:
          - "WEBRUNNER complete — {{ webrunner_name }}"
          - "Results: {{ results_dir }}/merged_results.json"
          - "Scanner IPs: {{ scanner_ip_log }}"
          - "Log: logs/deployment_{{ deployment_id }}.log"


- name: WEBRUNNER — Teardown scan nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    all_node_chunks: "{{ lookup('file', node_chunks_file) | from_json }}"
    linode_chunks: "{{ all_node_chunks | selectattr('provider', 'equalto', 'linode') | list }}"
    aws_chunks: "{{ all_node_chunks | selectattr('provider', 'equalto', 'aws') | list }}"
    aws_cleanup_regions: "{{ aws_chunks | map(attribute='region') | unique | list }}"

  tasks:
    - name: Teardown Linode nodes
      uri:
        url: "https://api.linode.com/v4/linode/instances/{{ hostvars[item]['linode_instance_id'] }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
        status_code: [200, 204, 404]
      loop: "{{ groups['webrunner_nodes'] | default([]) }}"
      when:
        - teardown_after_scan | default(true) | bool
        - hostvars[item]['provider'] == 'linode'
        - hostvars[item]['linode_instance_id'] is defined

    - name: Verify Linode nodes are absent
      uri:
        url: "https://api.linode.com/v4/linode/instances/{{ hostvars[item]['linode_instance_id'] }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
        status_code: [200, 404]
      register: wr_linode_absence
      until: wr_linode_absence.status == 404
      retries: 36
      delay: 5
      loop: "{{ groups['webrunner_nodes'] | default([]) }}"
      when:
        - teardown_after_scan | default(true) | bool
        - hostvars[item]['provider'] == 'linode'
        - hostvars[item]['linode_instance_id'] is defined
      no_log: true

    - name: Inventory Linode profile keys
      uri:
        url: "https://api.linode.com/v4/profile/sshkeys?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
        return_content: true
        status_code: 200
      register: wr_linode_keys
      when:
        - teardown_after_scan | default(true) | bool
        - linode_chunks | length > 0
      no_log: true

    - name: Refuse incomplete Linode key inventory
      assert:
        that:
          - wr_linode_keys.json.pages | default(1) | int == 1
        fail_msg: "Linode profile-key inventory is incomplete."
      when:
        - teardown_after_scan | default(true) | bool
        - linode_chunks | length > 0

    - name: Initialize WEBRUNNER Linode key inventory
      set_fact:
        wr_owned_linode_keys: []
      when:
        - teardown_after_scan | default(true) | bool
        - linode_chunks | length > 0

    - name: Select WEBRUNNER Linode profile keys
      set_fact:
        wr_owned_linode_keys: "{{ wr_owned_linode_keys + [item] }}"
      loop: >-
        {{ (wr_linode_keys | default({'json': {'data': []}})).json.data
           | default([]) }}
      loop_control:
        label: "{{ item.label | default(item.id) }}"
      when:
        - teardown_after_scan | default(true) | bool
        - linode_chunks | length > 0
        - item.label == webrunner_name

    - name: Delete WEBRUNNER Linode profile keys
      uri:
        url: "https://api.linode.com/v4/profile/sshkeys/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
        status_code: [200, 204, 404]
      loop: "{{ wr_owned_linode_keys | default([]) }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Verify WEBRUNNER Linode profile keys are absent
      uri:
        url: "https://api.linode.com/v4/profile/sshkeys/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'LINODE_TOKEN') }}"
        status_code: [200, 404]
      register: wr_linode_key_absence
      until: wr_linode_key_absence.status == 404
      retries: 12
      delay: 2
      loop: "{{ wr_owned_linode_keys | default([]) }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Teardown AWS nodes
      amazon.aws.ec2_instance:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        instance_ids:
          - "{{ hostvars[item]['ec2_instance_id'] }}"
        region: "{{ hostvars[item]['ec2_region'] }}"
        state: absent
        wait: true
        wait_timeout: 300
      loop: "{{ groups['webrunner_nodes'] | default([]) }}"
      when:
        - teardown_after_scan | default(true) | bool
        - hostvars[item]['provider'] == 'aws'
        - hostvars[item]['ec2_instance_id'] is defined

    - name: Delete AWS WEBRUNNER security groups
      amazon.aws.ec2_security_group:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "webrunner-{{ webrunner_name }}"
        region: "{{ item }}"
        state: absent
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: Delete AWS WEBRUNNER key pairs
      amazon.aws.ec2_key:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        name: "{{ webrunner_name }}"
        region: "{{ item }}"
        state: absent
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: Verify AWS WEBRUNNER security groups are absent
      amazon.aws.ec2_security_group_info:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ item }}"
        filters:
          group-name: "webrunner-{{ webrunner_name }}"
      register: wr_aws_sg_absence
      until: wr_aws_sg_absence.security_groups | length == 0
      retries: 30
      delay: 10
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: Verify AWS WEBRUNNER key pairs are absent
      amazon.aws.ec2_key_info:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ item }}"
        names:
          - "{{ webrunner_name }}"
      register: wr_aws_key_absence
      until: wr_aws_key_absence.keypairs | length == 0
      retries: 12
      delay: 5
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: Find WEBRUNNER VPCs per region
      amazon.aws.ec2_vpc_net_info:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ item }}"
        filters:
          "tag:Name": "wr-{{ deployment_id }}-vpc"
          "tag:deployment_id": "{{ deployment_id }}"
      register: wr_aws_vpc_info
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: List WEBRUNNER VPCs to remove
      set_fact:
        wr_aws_vpcs_to_delete: "{{ wr_aws_vpcs_to_delete | default([]) + [{'region': item.item, 'vpc_id': item.vpcs[0].vpc_id}] }}"
      loop: "{{ wr_aws_vpc_info.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0
        - item.vpcs | default([]) | length > 0

    - name: Delete WEBRUNNER route tables
      amazon.aws.ec2_vpc_route_table:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        vpc_id: "{{ item.vpc_id }}"
        region: "{{ item.region }}"
        tags:
          Name: "wr-{{ deployment_id }}-rt"
        lookup: tag
        state: absent
      loop: "{{ wr_aws_vpcs_to_delete | default([]) }}"

    - name: Delete WEBRUNNER subnets
      amazon.aws.ec2_vpc_subnet:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        vpc_id: "{{ item.vpc_id }}"
        cidr: 10.0.1.0/24
        region: "{{ item.region }}"
        state: absent
      loop: "{{ wr_aws_vpcs_to_delete | default([]) }}"

    - name: Detach and delete WEBRUNNER internet gateways
      amazon.aws.ec2_vpc_igw:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        vpc_id: "{{ item.vpc_id }}"
        region: "{{ item.region }}"
        state: absent
      loop: "{{ wr_aws_vpcs_to_delete | default([]) }}"

    - name: Delete WEBRUNNER VPCs
      amazon.aws.ec2_vpc_net:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        vpc_id: "{{ item.vpc_id }}"
        region: "{{ item.region }}"
        state: absent
      loop: "{{ wr_aws_vpcs_to_delete | default([]) }}"
      register: wr_aws_vpc_delete
      until: wr_aws_vpc_delete is success
      retries: 5
      delay: 15

    - name: Verify WEBRUNNER VPCs are absent
      amazon.aws.ec2_vpc_net_info:
        access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ item }}"
        filters:
          "tag:Name": "wr-{{ deployment_id }}-vpc"
          "tag:deployment_id": "{{ deployment_id }}"
      register: wr_aws_vpc_absence
      until: wr_aws_vpc_absence.vpcs | length == 0
      retries: 12
      delay: 5
      loop: "{{ aws_cleanup_regions }}"
      when:
        - teardown_after_scan | default(true) | bool
        - aws_chunks | length > 0

    - name: Teardown complete
      debug:
        msg: "All WEBRUNNER scan nodes and provider auxiliaries are absent."
      when:
        - teardown_after_scan | default(true) | bool
        - groups['webrunner_nodes'] is defined
        - groups['webrunner_nodes'] | length > 0
