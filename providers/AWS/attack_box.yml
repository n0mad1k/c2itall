---
# AWS Attack Box Deployment Playbook
# Provisions a dedicated VPC plus one Kali instance, then configures it in place.

- name: Deploy Attack Box on AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    deployment_type: "attack_box"
    instance_type: "{{ aws_instance_type | default('t3.small') }}"
    ssh_key_name: "attack-box-{{ deployment_id }}"
    attack_box_ssh_user: "{{ 'ubuntu' if attack_box_type | default('kali') == 'ubuntu' else 'kali' }}"
    attack_box_info_file: "{{ playbook_dir }}/../../logs/attack_box_{{ deployment_id }}_info.txt"
    resource_tags:
      deployment_id: "{{ deployment_id }}"
      DeploymentID: "{{ deployment_id }}"
      Type: "attack-box"

  tasks:
    - name: Default inputs the controller may not supply
      set_fact:
        attack_box_name: "{{ attack_box_name | default('a-' + deployment_id) }}"
        attack_box_type: "{{ attack_box_type | default('kali') }}"
        aws_region: "{{ aws_region | default(aws_region_choices | random) }}"

    - name: Validate AWS credentials
      assert:
        that:
          - aws_access_key is defined and aws_access_key != ""
          - aws_secret_key is defined and aws_secret_key != ""
          - operator_ip is defined and (operator_ip | string) is match('^\d{1,3}(\.\d{1,3}){3}$')
        fail_msg: "AWS credentials and a valid single-IPv4 operator_ip are required"

    - name: Resolve the Kali AMI for the attack box region
      include_tasks: kali_ami.yml
      vars:
        kali_ami_region: "{{ aws_region }}"
      when: attack_box_type != 'ubuntu'

    - name: Set attack box AMI
      set_fact:
        attack_box_ami: "{{ kali_ami }}"
      when: attack_box_type != 'ubuntu'

    - name: Set the Ubuntu attack box AMI
      set_fact:
        attack_box_ami: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id', region=aws_region) }}"
      when: attack_box_type == 'ubuntu'

    - name: Debug attack box deployment
      debug:
        msg: "Deploying {{ attack_box_type }} attack box on AWS in {{ aws_region }} from {{ attack_box_ami }}"

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ attack_box_name }}-vpc"
        cidr_block: "10.0.0.0/16"
        region: "{{ aws_region }}"
        tags: "{{ resource_tags | combine({'Name': attack_box_name + '-vpc'}) }}"
        state: present
      register: vpc_result

    - name: Create internet gateway for VPC
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ aws_region }}"
        state: present
        tags: "{{ resource_tags | combine({'Name': attack_box_name + '-igw'}) }}"
      register: igw_result

    - name: Create subnet in VPC
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_result.vpc.id }}"
        cidr: "10.0.1.0/24"
        region: "{{ aws_region }}"
        az: "{{ aws_region }}a"
        map_public: yes
        tags: "{{ resource_tags | combine({'Name': attack_box_name + '-subnet'}) }}"
      register: subnet_result

    - name: Create routing table for internet access
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ aws_region }}"
        tags: "{{ resource_tags | combine({'Name': attack_box_name + '-rtb'}) }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw_result.gateway_id }}"
        subnets:
          - "{{ subnet_result.subnet.id }}"

    - name: Generate SSH key pair for attack box
      amazon.aws.ec2_key:
        name: "{{ ssh_key_name }}"
        region: "{{ aws_region }}"
        state: present
      register: ec2_key_result
      no_log: true

    - name: Save private key locally
      copy:
        content: "{{ ec2_key_result.key.private_key }}"
        dest: "~/.ssh/{{ ssh_key_name }}"
        mode: '0600'
      when: ec2_key_result.key.private_key is defined
      no_log: true

    - name: Create security group for attack box
      amazon.aws.ec2_security_group:
        name: "attack-box-sg-{{ deployment_id }}"
        description: "Security group for attack box {{ deployment_id }}"
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ operator_ip }}/32"
            rule_desc: "SSH access from operator IP"
          - proto: tcp
            ports:
              - 80
              - 443
            cidr_ip: 0.0.0.0/0
            rule_desc: "HTTP/HTTPS for tools"
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
        tags: "{{ resource_tags | combine({'Name': 'attack-box-sg-' + deployment_id}) }}"
        state: present
      register: security_group

    - name: Launch attack box EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ attack_box_name }}"
        key_name: "{{ ssh_key_name }}"
        vpc_subnet_id: "{{ subnet_result.subnet.id }}"
        security_groups:
          - "{{ security_group.group_id }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ attack_box_ami }}"
        region: "{{ aws_region }}"
        network:
          assign_public_ip: true
        wait: true
        state: running
        volumes:
          - device_name: "{{ '/dev/sda1' if attack_box_type == 'ubuntu' else '/dev/xvda' }}"
            ebs:
              # Full attack-box installs exceed the Ubuntu AMI's small root disk.
              volume_size: "{{ [aws_volume_size | default(64) | int, 64] | max }}"
              volume_type: gp3
              delete_on_termination: true
        tags: "{{ resource_tags | combine({'Name': attack_box_name, 'Environment': attack_box_type}) }}"
        user_data: |
          #!/bin/bash
          hostnamectl set-hostname "{{ attack_box_name }}"
          mkdir -p /root/deployment-info
          cat > /root/deployment-info/info.txt << EOF
          Deployment ID: {{ deployment_id }}
          Attack Box Name: {{ attack_box_name }}
          Attack Box Type: {{ attack_box_type }}
          Region: {{ aws_region }}
          Instance Type: {{ instance_type }}
          SSH Key: {{ ssh_key_name }}
          EOF
      register: ec2_result

    - name: Set attack box facts for other playbooks
      set_fact:
        attack_box_ip: "{{ ec2_result.instances[0].public_ip_address }}"
        attack_box_instance_id: "{{ ec2_result.instances[0].instance_id }}"
        attack_box_public_ip: "{{ ec2_result.instances[0].public_ip_address }}"
        attack_box_private_ip: "{{ ec2_result.instances[0].private_ip_address }}"
        attack_box_security_group: "{{ security_group.group_name }}"

    - name: Wait for SSH to be available
      wait_for:
        host: "{{ attack_box_ip }}"
        port: 22
        delay: 30
        timeout: 300

    - name: Display attack box information
      debug:
        msg:
          - "Attack box deployed successfully!"
          - "Instance ID: {{ attack_box_instance_id }}"
          - "Public IP: {{ attack_box_ip }}"
          - "Private IP: {{ attack_box_private_ip }}"
          - "SSH Command: ssh -i ~/.ssh/{{ ssh_key_name }} {{ attack_box_ssh_user }}@{{ attack_box_ip }}"

    - name: Save deployment information
      copy:
        content: |
          # Attack Box Deployment Information
          Instance ID: {{ attack_box_instance_id }}
          Public IP: {{ attack_box_ip }}
          Private IP: {{ attack_box_private_ip }}
          SSH Key: ~/.ssh/{{ ssh_key_name }}
          SSH Command: ssh -i ~/.ssh/{{ ssh_key_name }} {{ attack_box_ssh_user }}@{{ attack_box_ip }}
          Region: {{ aws_region }}
          Instance Type: {{ instance_type }}
          AMI: {{ attack_box_ami }}
          Security Group: {{ security_group.group_name }}
        dest: "{{ attack_box_info_file }}"
        mode: '0600'

    - name: Add attack box to inventory
      add_host:
        name: "{{ attack_box_ip }}"
        groups: attack_boxes
        ansible_host: "{{ attack_box_ip }}"
        ansible_user: "{{ attack_box_ssh_user }}"
        ansible_ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
        ansible_python_interpreter: "/usr/bin/python3"
        attack_box_type: "{{ attack_box_type }}"
        attack_box_name: "{{ attack_box_name }}"
        deployment_id: "{{ deployment_id }}"
        provider: aws

- name: Configure Attack Box
  hosts: attack_boxes
  gather_facts: yes
  become: yes

  tasks:
    - name: Default inputs the controller may not supply
      set_fact:
        setup_workspace: "{{ setup_workspace | default(true) }}"
        setup_vpn: "{{ setup_vpn | default(false) }}"
        setup_tor: "{{ setup_tor | default(false) }}"

    - name: Wait for system to be ready
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Wait for cloud-init to finish
      command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Refresh root filesystem facts after cloud-init growth
      ansible.builtin.setup:
        filter: ansible_mounts
      when: deployment_type != "quick_recon_box"

    - name: Record full attack box root filesystem capacity
      set_fact:
        attack_box_root_bytes: "{{ (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='size_total') | first | default(0)) | int }}"
      when: deployment_type != "quick_recon_box"

    - name: Require enough root capacity for the full toolset
      assert:
        that:
          - attack_box_root_bytes | int >= 60 * 1024 * 1024 * 1024
        fail_msg: "Full attack boxes require at least 60 GiB of usable root capacity"
      when: deployment_type != "quick_recon_box"

    - name: Wait for package manager locks to clear
      shell: |
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 5; done
      changed_when: false

    - name: Include attack box configuration tasks
      include_tasks: "{{ playbook_dir }}/../../modules/attack-box/tasks/configure_attack_box.yml"
      when: deployment_type != "quick_recon_box"

    - name: Include quick recon configuration tasks
      include_tasks: "{{ playbook_dir }}/../../modules/attack-box/tasks/configure_quick_recon.yml"
      when: deployment_type == "quick_recon_box"

    - name: Display final setup information
      debug:
        msg:
          - "Attack Box Configuration Complete!"
          - "Instance: {{ attack_box_name }}"
          - "SSH Command: ssh -i ~/.ssh/attack-box-{{ deployment_id }} {{ ansible_user }}@{{ ansible_host }}"
          - "Quick Reference: /root/QUICK_RECON_GUIDE.txt"
