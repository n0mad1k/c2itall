---
# AWS Gophish Deployment Playbook

- name: Deploy AWS gophish
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - vars.yaml
  vars:
    # Default values
    instance_type: "{{ aws_instance_type | default('t2.micro') }}"
    # Check for shared infrastructure
    use_shared_infra: "{{ not (c2_region is defined and gophish_region is defined and c2_region != gophish_region) and not c2_only | default(false) | bool and not gophish_only | default(false) | bool }}"

  tasks:
    - name: Default inputs the controller may not supply
      set_fact:
        ssh_user: "{{ ssh_user | default('ubuntu') }}"
        aws_region: "{{ aws_region | default(aws_region_choices | random) }}"
        deployment_id: "{{ deployment_id | default('') }}"
        gophish_name: "{{ gophish_name | default('gophish-' + deployment_id) }}"

    - name: Validate AWS credentials
      assert:
        that:
          - aws_access_key is defined and aws_access_key != ""
          - aws_secret_key is defined and aws_secret_key != ""
        fail_msg: "AWS credentials are required"

    - name: Validate operator IP
      assert:
        that:
          - operator_ip is defined and (operator_ip | string) is match('^\d{1,3}(\.\d{1,3}){3}$')
        fail_msg: "operator_ip must be defined and a single IPv4 address"

    # Set region for gophish - fix for noop task error
    - name: Set region for gophish
      set_fact:
        aws_gophish_region: "{{ gophish_region | default(aws_region) }}"

    # Load shared infrastructure state if available
    - name: Check for shared infrastructure state
      block:
        - name: Check if state file exists
          stat:
            path: "infrastructure_state_{{ deployment_id }}.json"
          register: infra_state_file

        - name: Include vars if file exists
          include_vars:
            file: "infrastructure_state_{{ deployment_id }}.json"
            name: shared_infra
          when: infra_state_file.stat.exists | default(false)
      when: use_shared_infra | bool

    # After loading shared infrastructure state
    - name: Validate shared VPC exists
      amazon.aws.ec2_vpc_net_info:
        region: "{{ shared_infra.region }}"
        vpc_ids:
          - "{{ shared_infra.vpc_id }}"
      register: vpc_check
      when: use_shared_infra | bool and infra_state_file.stat.exists | default(false)
      ignore_errors: yes

    - name: Delete stale infrastructure state file
      file:
        path: "infrastructure_state.json"
        state: absent
      when: use_shared_infra | bool and vpc_check.vpcs is defined and vpc_check.vpcs | length == 0

    - name: Disable shared infrastructure when VPC doesn't exist
      set_fact:
        use_shared_infra: false
      when: use_shared_infra | bool and vpc_check.vpcs is defined and vpc_check.vpcs | length == 0

    - name: Set region variables from shared infra
      set_fact:
        aws_gophish_region: "{{ shared_infra.region | default(aws_region) }}"
      when: use_shared_infra | bool and infra_state_file.stat.exists | default(false)

    - name: Set AMI ID for selected region
      set_fact:
        ami_id: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id', region=aws_gophish_region) }}"

    # Create new infrastructure only if not using shared
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ gophish_name }}-vpc"
        cidr_block: "10.0.0.0/16"
        region: "{{ aws_gophish_region }}"
        tags:
          Name: "{{ gophish_name }}-vpc"
          deployment_id: "{{ deployment_id }}"
        state: present
      register: vpc_result
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    - name: Create internet gateway for VPC
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ aws_gophish_region }}"
        state: present
        tags:
          Name: "{{ gophish_name }}-igw"
          deployment_id: "{{ deployment_id }}"
      register: igw_result
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    - name: Create subnet in VPC
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_result.vpc.id }}"
        cidr: "10.0.1.0/24"
        region: "{{ aws_gophish_region }}"
        az: "{{ aws_gophish_region }}a"
        map_public: yes
        tags:
          Name: "{{ gophish_name }}-subnet"
          deployment_id: "{{ deployment_id }}"
      register: subnet_result
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    - name: Create routing table for internet access
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ aws_gophish_region }}"
        tags:
          Name: "{{ gophish_name }}-rtb"
          deployment_id: "{{ deployment_id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw_result.gateway_id }}"
        subnets:
          - "{{ subnet_result.subnet.id }}"
      register: route_table_result
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    # Set VPC ID based on shared or created
    - name: Set VPC ID from shared infrastructure
      set_fact:
        vpc_id: "{{ shared_infra.vpc_id }}"
        subnet_id: "{{ shared_infra.subnet_id }}"
        gophish_vpc_id: "{{ shared_infra.vpc_id }}"  # Store for cleanup reference
      when: use_shared_infra | bool and infra_state_file.stat.exists | default(false)

    - name: Set VPC ID from created infrastructure
      set_fact:
        vpc_id: "{{ vpc_result.vpc.id }}"
        subnet_id: "{{ subnet_result.subnet.id }}"
        gophish_vpc_id: "{{ vpc_result.vpc.id }}"  # Store for cleanup reference
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    # Load infra state for source IPs used in SG rules
    - name: Load infrastructure state for source IPs
      block:
        - name: Check if infrastructure state file exists
          stat:
            path: "infrastructure_state_{{ deployment_id }}.json"
          register: infra_state_check

        - name: Load infrastructure state
          include_vars:
            file: "infrastructure_state_{{ deployment_id }}.json"
            name: infra_state
          when: infra_state_check.stat.exists

        - name: Set phishing redirector IP from infrastructure state
          set_fact:
            phishing_redirector_ip: "{{ infra_state.phishing_redirector_ip | default(infra_state.redirector_ip | default(operator_ip)) }}"
          when: infra_state_check.stat.exists

        - name: Set mta_ip_src from infrastructure state
          set_fact:
            mta_ip_src: "{{ infra_state.mta_ip | default(operator_ip) }}"
          when: infra_state_check.stat.exists

    - name: Default phishing_redirector_ip when no state file exists
      set_fact:
        phishing_redirector_ip: "{{ operator_ip }}"
      when: phishing_redirector_ip is not defined

    - name: Default mta_ip_src when no state file exists
      set_fact:
        mta_ip_src: "{{ operator_ip }}"
      when: mta_ip_src is not defined

    - name: Create security group for gophish
      amazon.aws.ec2_security_group:
        name: "{{ gophish_name }}-sg"
        description: "Security group for gophish server {{ gophish_name }}"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_gophish_region }}"
        rules:
          # Management access only from operator IP
          - proto: tcp
            ports: 22
            cidr_ip: "{{ operator_ip }}/32"
          # Gophish admin UI only reachable from the operator
          - proto: tcp
            ports: 3333
            cidr_ip: "{{ operator_ip }}/32"
          # Gophish landing page/tracking only reachable from the phishing redirector
          - proto: tcp
            ports: 80
            cidr_ip: "{{ phishing_redirector_ip }}/32"
          # SMTP submission only reachable from the mta front
          - proto: tcp
            ports: 25
            cidr_ip: "{{ mta_ip_src }}/32"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: security_group

    # Save infrastructure state for reuse
    - name: Save infrastructure state for reuse
      copy:
        content: |
          {
            "vpc_id": "{{ vpc_id }}",
            "subnet_id": "{{ subnet_id }}",
            "security_group_id": "{{ security_group.group_id }}",
            "region": "{{ aws_gophish_region }}",
            "deployment_id": "{{ deployment_id }}"
          }
        dest: "infrastructure_state_{{ deployment_id }}.json"
      when: not (use_shared_infra | bool and infra_state_file.stat.exists | default(false))

    # Generate or import SSH key for the deployment
    - name: Check if deployment SSH key already exists locally
      stat:
        path: "~/.ssh/c2deploy_{{ deployment_id }}.pem"
      register: ssh_key_file

    - name: Generate SSH key pair if it doesn't exist
      block:
        - name: Create SSH key pair
          command: ssh-keygen -t rsa -b 2048 -f ~/.ssh/c2deploy_{{ deployment_id }} -N ""
          args:
            creates: "~/.ssh/c2deploy_{{ deployment_id }}"

        - name: Rename private key to .pem format
          command: mv ~/.ssh/c2deploy_{{ deployment_id }} ~/.ssh/c2deploy_{{ deployment_id }}.pem
          args:
            creates: "~/.ssh/c2deploy_{{ deployment_id }}.pem"
            removes: "~/.ssh/c2deploy_{{ deployment_id }}"
      when: not ssh_key_file.stat.exists

    - name: Ensure proper permissions on SSH key
      file:
        path: "~/.ssh/c2deploy_{{ deployment_id }}.pem"
        mode: '0600'
        state: file

    # Check if key pair exists in AWS
    - name: Check if key pair exists in AWS
      amazon.aws.ec2_key_info:
        region: "{{ aws_gophish_region }}"
        filters:
          key-name: "c2deploy_{{ deployment_id }}"
      register: existing_key_pair

    # Import SSH key to AWS
    - name: Import SSH key to AWS
      amazon.aws.ec2_key:
        name: "c2deploy_{{ deployment_id }}"
        key_material: "{{ lookup('file', '~/.ssh/c2deploy_{{ deployment_id }}.pub') }}"
        region: "{{ aws_gophish_region }}"
        state: present
      when: existing_key_pair.keypairs | length == 0

    # Launch the gophish instance
    - name: Launch gophish instance
      amazon.aws.ec2_instance:
        name: "{{ gophish_name }}"
        key_name: "c2deploy_{{ deployment_id }}"
        instance_type: "{{ instance_type | default('t2.micro') }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ security_group.group_id }}"
        image_id: "{{ ami_id }}"
        region: "{{ aws_gophish_region }}"
        state: present
        wait: yes
        volumes:
          - device_name: "/dev/xvda"
            ebs:
              volume_size: 20
              delete_on_termination: true
        tags:
          Name: "{{ gophish_name }}"
          deployment_id: "{{ deployment_id }}"
      register: gophish_instance

    - name: Set gophish_ip for later use
      set_fact:
        gophish_ip: "{{ gophish_instance.instances[0].public_ip_address }}"
        gophish_instance_id: "{{ gophish_instance.instances[0].instance_id }}"

    # Persist gophish_ip into infrastructure state for downstream playbooks
    - name: Merge gophish IP into infrastructure state
      block:
        - name: Check if infrastructure state file exists for gophish IP merge
          stat:
            path: "infrastructure_state_{{ deployment_id }}.json"
          register: gophish_ip_state_file

        - name: Load existing infrastructure state
          include_vars:
            file: "infrastructure_state_{{ deployment_id }}.json"
            name: infra_state
          when: gophish_ip_state_file.stat.exists

        - name: Default infra_state when no state file exists
          set_fact:
            infra_state: {}
          when: not gophish_ip_state_file.stat.exists

        - name: Save merged infrastructure state with gophish IP
          copy:
            content: "{{ infra_state | default({}) | combine({'gophish_ip': gophish_ip}) | to_nice_json }}"
            dest: "infrastructure_state_{{ deployment_id }}.json"

    - name: Display gophish instance details for debugging
      debug:
        msg:
          - "Gophish IP: {{ gophish_ip }}"
          - "Gophish Instance ID: {{ gophish_instance_id }}"
          - "SSH User to use: {{ ssh_user }}"
          - "SSH Key path: ~/.ssh/c2deploy_{{ deployment_id }}.pem"

    - name: Wait for instance initialization
      pause:
        seconds: 120
      when: gophish_instance.changed

    - name: Set correct permissions on SSH key
      file:
        path: "~/.ssh/c2deploy_{{ deployment_id }}.pem"
        mode: "0600"

    - name: Wait for gophish SSH to be available
      wait_for:
        host: "{{ gophish_ip }}"
        port: 22
        delay: 30
        timeout: 300
        state: started

    - name: Add gophish to inventory
      add_host:
        name: "gophish"
        groups: "gophish_servers"
        ansible_host: "{{ gophish_ip }}"
        ansible_user: "ubuntu"
        ansible_ssh_private_key_file: "~/.ssh/c2deploy_{{ deployment_id }}.pem"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes"
        ansible_python_interpreter: "/usr/bin/python3"
        # Add necessary variables for gophish configuration
        operator_ip: "{{ operator_ip }}"
        phishing_redirector_ip: "{{ phishing_redirector_ip }}"
        mta_ip_src: "{{ mta_ip_src }}"
        domain: "{{ domain }}"
        deployment_id: "{{ deployment_id }}"
        zero_logs: "{{ zero_logs | default(true) }}"

# Rest of the playbook for configuring the gophish server
- name: Configure gophish
  hosts: gophish_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml

  tasks:
    - name: Include gophish server configuration tasks
      include_tasks: "../../modules/phishing/gophish/tasks/configure_phishing_server.yml"

    - name: Include gophish advanced configuration tasks
      include_tasks: "../../modules/phishing/gophish/tasks/configure_gophish_advanced.yml"

    - name: Include common security hardening tasks
      include_tasks: "../../common/tasks/security_hardening.yml"

    - name: Configure integrated click tracker
      include_tasks: "../../modules/c2/tasks/configure_integrated_tracker.yml"
      when: deploy_tracker | default(true) | bool

    - name: Print deployment summary
      debug:
        msg:
          - "Gophish Deployment Complete!"
          - "-----------------------------"
          - "Gophish IP: {{ ansible_host }}"
          - "SSH Key: ~/.ssh/c2deploy_{{ hostvars['localhost']['deployment_id'] }}.pem"
      when: not disable_summary | default(false)
