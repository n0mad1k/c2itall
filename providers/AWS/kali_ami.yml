---
# Resolve the newest image of the Kali marketplace product the account is
# subscribed to, the way the Azure route tracks the current marketplace image.
# An ami_map entry for the region still wins when an operator provides one.
- name: Resolve the Kali AMI from the operator map
  set_fact:
    kali_ami: "{{ ami_map[kali_ami_region] }}"
  when: (ami_map | default({}))[kali_ami_region] is defined

- name: Find the current Kali marketplace image in the region
  amazon.aws.ec2_ami_info:
    region: "{{ kali_ami_region }}"
    owners: ["aws-marketplace"]
    filters:
      product-code: "{{ kali_product_code | default('7lgvy7mt78lgoi4lant0znp5h') }}"
      architecture: x86_64
      state: available
  register: kali_marketplace_images
  when: kali_ami is not defined

- name: Resolve the Kali AMI from the marketplace listing
  set_fact:
    kali_ami: "{{ (kali_marketplace_images.images | sort(attribute='creation_date') | last).image_id }}"
  when: kali_ami is not defined and (kali_marketplace_images.images | default([]) | length) > 0

- name: Ensure a Kali AMI is available
  assert:
    that: kali_ami is defined and (kali_ami | length) > 0
    fail_msg: "No Kali image found in {{ kali_ami_region }}: subscribe to the Kali marketplace product or add an ami_map entry for the region to vars.yaml"
