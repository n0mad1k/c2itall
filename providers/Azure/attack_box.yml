---
- name: Wait for the Azure quick-recon VM
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the Azure quick-recon attack box
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Validate the supported attack-box subtype
      ansible.builtin.assert:
        that:
          - provider == 'azure'
          - provider_workload == 'attack_box'
          - attack_box_type == 'quick_recon'
          - deployment_type == 'quick_recon_box'
        fail_msg: Azure currently supports only the quick-recon attack-box subtype

    - name: Configure quick-recon tools and workspace
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../modules/attack-box/tasks/configure_quick_recon.yml"
