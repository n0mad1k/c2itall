---
- name: Delete an ownership-validated Azure resource group
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Submit deletion after controller ownership and ARM cancellation checks
      ansible.builtin.command:
        argv:
          - az
          - group
          - delete
          - --subscription
          - "{{ azure_subscription_id }}"
          - --name
          - "{{ azure_resource_group }}"
          - --yes
          - --no-wait
          - --only-show-errors
          - --output
          - json
      changed_when: true
