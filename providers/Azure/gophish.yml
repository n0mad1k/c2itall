---
- name: Wait for the Azure GoPhish server VM
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

- name: Configure the Azure GoPhish server
  hosts: gophish_servers
  become: true
  gather_facts: true
  tasks:
    - name: Validate the phishing route inputs
      ansible.builtin.assert:
        that:
          - provider == 'azure'
          - provider_workload == 'phishing'
          - domain | length > 0
        fail_msg: Azure phishing requires a domain

    - name: Wait for apt to be available
      ansible.builtin.apt:
        update_cache: yes
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10

    - name: Configure the GoPhish server
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../modules/phishing/gophish/tasks/configure_phishing_server.yml"

    - name: Apply the shared hardening
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/tasks/security_hardening.yml"

    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "GoPhish server deployment complete: {{ inventory_hostname }} ({{ domain }})"
