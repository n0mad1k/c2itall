---
- name: "Try Linode fallback region {{ linode_candidate_region }}"
  community.general.linode_v4:
    access_token: "{{ linode_token }}"
    label: "{{ linode_instance_label }}"
    type: "{{ linode_instance_type }}"
    region: "{{ linode_candidate_region }}"
    image: "{{ linode_instance_image }}"
    root_pass: "{{ linode_instance_root_password }}"
    authorized_keys:
      - "{{ lookup('file', ssh_key_path) }}"
    state: present
  register: linode_fallback_region_attempt
  failed_when: false
  when: not (linode_instance_created | bool)

- name: "Accept Linode fallback region {{ linode_candidate_region }}"
  set_fact:
    linode_instance_created: true
    linode_created_instance: "{{ linode_fallback_region_attempt }}"
    linode_created_region: "{{ linode_candidate_region }}"
  when:
    - not (linode_instance_created | bool)
    - not (linode_fallback_region_attempt.failed | default(false))
    - linode_fallback_region_attempt.instance is defined
