---
- name: Initialize Linode region fallback state
  set_fact:
    linode_instance_created: false
    linode_created_instance: {}
    linode_created_region: ""
    linode_instance_root_password: "{{ lookup('password', '/dev/null length=16') }}"

- name: Try requested Linode region
  community.general.linode_v4:
    access_token: "{{ linode_token }}"
    label: "{{ linode_instance_label }}"
    type: "{{ linode_instance_type }}"
    region: "{{ linode_requested_region }}"
    image: "{{ linode_instance_image }}"
    root_pass: "{{ linode_instance_root_password }}"
    authorized_keys:
      - "{{ lookup('file', ssh_key_path) }}"
    state: present
  register: linode_requested_region_attempt
  failed_when: false

- name: Accept instance from requested Linode region
  set_fact:
    linode_instance_created: true
    linode_created_instance: "{{ linode_requested_region_attempt }}"
    linode_created_region: "{{ linode_requested_region }}"
  when:
    - not (linode_requested_region_attempt.failed | default(false))
    - linode_requested_region_attempt.instance is defined

- name: Try Linode fallback regions until one succeeds
  include_tasks: try_instance_region.yml
  loop: >-
    {{ ['us-east', 'us-central', 'eu-west', 'us-west']
       | reject('equalto', linode_requested_region)
       | list }}
  loop_control:
    loop_var: linode_candidate_region
    label: "{{ linode_candidate_region }}"
  when: not (linode_instance_created | bool)

- name: Require a successful Linode region
  fail:
    msg: >-
      Instance {{ linode_instance_label }} could not be created in the requested
      region or any fallback region.
  when: not (linode_instance_created | bool)
