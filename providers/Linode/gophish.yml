---
# Linode Gophish-only Deployment Playbook

- name: Deploy Linode Gophish server
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - vars.yaml
  vars:
    # Use constant values directly to avoid recursive template resolution
    gophish_image_static: "linode/debian12"

  tasks:
    - name: Validate required Linode token
      assert:
        that:
          - linode_token is defined and linode_token != ""
        fail_msg: "Linode API token is required. Set linode_token in vars.yaml or via --linode-token."

    - name: Validate operator IP
      assert:
        that:
          - operator_ip is defined and (operator_ip | string) is match('^\d{1,3}(\.\d{1,3}){3}$')
        fail_msg: "operator_ip must be defined and a single IPv4 address."

    # Load existing infrastructure state so downstream host firewall rules can be scoped correctly
    - name: Check if infrastructure state file exists for Gophish source IP lookup
      stat:
        path: "infrastructure_state_{{ deployment_id }}.json"
      register: gophish_src_state_file

    - name: Load existing infrastructure state for Gophish source IPs
      include_vars:
        file: "infrastructure_state_{{ deployment_id }}.json"
        name: infra_state
      when: gophish_src_state_file.stat.exists

    - name: Default infra_state when no state file exists for Gophish source IPs
      set_fact:
        infra_state: {}
      when: not gophish_src_state_file.stat.exists

    - name: Set source IPs from infrastructure state
      set_fact:
        phishing_redirector_ip: "{{ infra_state.phishing_redirector_ip | default(infra_state.redirector_ip | default(operator_ip)) }}"
        mta_ip_src: "{{ infra_state.mta_ip | default(operator_ip) }}"

    # Update the region selection logic in Linode/gophish.yml
    - name: Set region for Gophish server
      set_fact:
        deployment_region: "{{ selected_region | default(linode_region, true) | default('us-east', true) }}"

    - name: Display region selection for Gophish server
      debug:
        msg: "Using region for Gophish server: {{ deployment_region }}"
      when: debug | default(false) | bool

    # Only use random region as a last resort
    - name: Set random region only if no region specified
      set_fact:
        deployment_region: "{{ region_choices | random }}"
      when: region_choices is defined and region_choices|length > 0 and not selected_region is defined and not linode_region is defined and not deployment_region is defined

    - name: Create Gophish server Linode instance with region fallback
      include_tasks: tasks/create_instance_with_fallback.yml
      vars:
        linode_instance_label: "{{ gophish_name }}"
        linode_instance_type: "{{ gophish_plan | default('g6-nanode-1') }}"
        linode_instance_image: "linode/debian12"
        linode_requested_region: "{{ deployment_region }}"

    - name: Store Gophish server Linode result
      set_fact:
        gophish_instance: "{{ linode_created_instance }}"
        deployment_region: "{{ linode_created_region }}"
        gophish_ip: "{{ linode_created_instance.instance.ipv4[0] }}"
        gophish_instance_id: "{{ linode_created_instance.instance.id }}"

    # Persist gophish_ip into infrastructure state for downstream playbooks
    - name: Merge Gophish IP into infrastructure state
      block:
        - name: Check if infrastructure state file exists for Gophish IP merge
          stat:
            path: "infrastructure_state_{{ deployment_id }}.json"
          register: gophish_ip_state_file

        - name: Load existing infrastructure state
          include_vars:
            file: "infrastructure_state_{{ deployment_id }}.json"
            name: infra_state
          when: gophish_ip_state_file.stat.exists

        - name: Default infra_state when no state file exists
          set_fact:
            infra_state: {}
          when: not gophish_ip_state_file.stat.exists

        - name: Save merged infrastructure state with Gophish IP
          copy:
            content: "{{ infra_state | default({}) | combine({'gophish_ip': gophish_ip}) | to_nice_json }}"
            dest: "infrastructure_state_{{ deployment_id }}.json"

    - name: Display final deployment region and IP
      debug:
        msg: "Gophish server deployed successfully in region {{ deployment_region }} with IP {{ gophish_ip }}"

    # Enhanced SSH wait task with better retry mechanism
    - name: Wait for Gophish server SSH to be available
      block:
        - name: Initial wait for port to be open
          wait_for:
            host: "{{ gophish_instance.instance.ipv4[0] }}"
            port: 22
            delay: 60
            timeout: 180
            state: started

        - name: Additional pause for SSH initialization
          pause:
            seconds: 60

        - name: Test SSH connection
          command: >
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
            -i {{ ssh_key_path | replace('.pub', '') }} root@{{ gophish_instance.instance.ipv4[0] }} echo "SSH Ready"
          register: ssh_test
          retries: 5
          delay: 20
          until: ssh_test.rc == 0
          ignore_errors: yes

        - name: Fail if SSH test unsuccessful
          fail:
            msg: "Could not connect to Gophish server via SSH after multiple attempts"
          when: ssh_test.rc != 0

    - name: Add Gophish server to inventory
      add_host:
        name: "gophish_server"
        groups: "gophish_servers"
        ansible_host: "{{ gophish_ip }}"
        ansible_user: "root"
        ansible_ssh_private_key_file: "{{ ssh_key_path | replace('.pub', '') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        operator_ip: "{{ operator_ip }}"
        phishing_redirector_ip: "{{ phishing_redirector_ip }}"
        mta_ip_src: "{{ mta_ip_src }}"
        redirector_ip: "{{ phishing_redirector_ip }}"
        domain: "{{ domain }}"
        deployment_id: "{{ deployment_id }}"
        zero_logs: "{{ zero_logs | default(false) }}"

- name: Configure Gophish server
  hosts: gophish_servers
  become: true
  gather_facts: true
  vars_files:
    - vars.yaml
  tasks:
    - name: Include Gophish server configuration tasks
      include_tasks: "../../modules/phishing/gophish/tasks/configure_phishing_server.yml"


    - name: Include common security hardening tasks
      include_tasks: "../../common/tasks/security_hardening.yml"


    - name: Print deployment summary
      debug:
        msg:
          - "Gophish Server Deployment Complete!"
          - "-------------------------------"
          - "Gophish Server IP: {{ ansible_host }}"
      when: not disable_summary | default(false)
