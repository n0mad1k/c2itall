# Copy to providers/Linode/vars.yaml (gitignored) and fill in your values.
# linode_token comes from Infisical (LINODE_TOKEN) or the environment; never store it here.

# Regions tried in order when the preferred region has no capacity.
region_choices:
  - us-east
  - us-central
  - us-west
  - us-southeast
  - ca-central
  - eu-west
  - eu-central
  - ap-southeast

linode_instance_type: "g6-nanode-1"
linode_image: "linode/debian12"

# Phishing / mail defaults used by the MTA, GoPhish and webserver plays.
domain: "example.com"
mail_hostname: "mail.example.com"
letsencrypt_email: "admin@example.com"
smtp_auth_user: "operator"
gophish_admin_port: "3333"
