---
- name: Clean up Linode infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    confirm_cleanup: false
    linode_known_labels:
      - "{{ redirector_name | default('r-' + deployment_id) }}"
      - "{{ c2_name | default('s-' + deployment_id) }}"
      - "{{ tracker_name | default('') }}"
      - "{{ attack_box_name | default('a-' + deployment_id) }}"
      - "{{ mta_name | default('mta-' + deployment_id) }}"
      - "{{ gophish_name | default('gophish-' + deployment_id) }}"
      - "{{ webserver_name | default('web-' + deployment_id) }}"
      - "{{ phishing_redirector_name | default('') }}"
      - "{{ phishing_webserver_name | default('') }}"
      - "{{ payload_server_name | default('ps-' + deployment_id) }}"
      - "{{ payload_redirector_name | default('pr-' + deployment_id) }}"
    linode_known_key_labels:
      - "{{ webrunner_name | default('') }}"
      - "{{ ssh_key_name | default('') }}"
      - "{{ ssh_key_path | default('') | basename | regex_replace('\\.pub$', '') }}"
      - "{{ 'c2deploy_' + (attack_box_name | default('a-' + deployment_id)) }}"

  tasks:
    - name: Validate cleanup identity and token
      ansible.builtin.assert:
        that:
          - deployment_id is string
          - deployment_id | length > 0
          - linode_token is defined
          - linode_token | length > 0
        fail_msg: "A deployment ID and Linode API token are required."

    - name: Confirm cleanup operation
      ansible.builtin.pause:
        prompt: "Type 'yes' to delete Linode resources owned by {{ deployment_id }}"
      register: cleanup_confirmation
      when: confirm_cleanup | bool

    - name: Require explicit confirmation when enabled
      ansible.builtin.assert:
        that:
          - cleanup_confirmation.user_input | default('') == 'yes'
        fail_msg: "Cleanup cancelled by user."
      when: confirm_cleanup | bool

    - name: Inventory Linodes before cleanup
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/linode/instances?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        return_content: true
        status_code: 200
      register: linode_before
      no_log: true

    - name: Refuse incomplete Linode pagination
      ansible.builtin.assert:
        that:
          - linode_before.json.pages | default(1) | int == 1
        fail_msg: "Linode inventory exceeds one page; cleanup cannot prove ownership completely."

    - name: Initialize owned Linode inventory
      ansible.builtin.set_fact:
        linode_owned_instances: []

    - name: Select deployment-owned Linodes
      ansible.builtin.set_fact:
        linode_owned_instances: "{{ linode_owned_instances + [item] }}"
      loop: "{{ linode_before.json.data | default([]) }}"
      loop_control:
        label: "{{ item.label | default(item.id) }}"
      when: >-
        deployment_id in (item.tags | default([])) or
        item.label in (linode_known_labels | reject('equalto', '') | list)

    - name: Delete deployment-owned Linodes by immutable ID
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/linode/instances/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        status_code: [200, 204, 404]
      loop: "{{ linode_owned_instances }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Verify every owned Linode is absent
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/linode/instances/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        status_code: [200, 404]
      register: linode_absence
      until: linode_absence.status == 404
      retries: 36
      delay: 5
      loop: "{{ linode_owned_instances }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Inventory Linode profile SSH keys
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/profile/sshkeys?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        return_content: true
        status_code: 200
      register: linode_keys_before
      no_log: true

    - name: Refuse incomplete SSH-key pagination
      ansible.builtin.assert:
        that:
          - linode_keys_before.json.pages | default(1) | int == 1
        fail_msg: "Linode SSH-key inventory exceeds one page; cleanup is unverified."

    - name: Initialize owned Linode SSH-key inventory
      ansible.builtin.set_fact:
        linode_owned_keys: []

    - name: Select deployment-owned Linode SSH keys
      ansible.builtin.set_fact:
        linode_owned_keys: "{{ linode_owned_keys + [item] }}"
      loop: "{{ linode_keys_before.json.data | default([]) }}"
      loop_control:
        label: "{{ item.label | default(item.id) }}"
      when: item.label in (linode_known_key_labels | reject('equalto', '') | list)

    - name: Delete deployment-owned Linode SSH keys
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/profile/sshkeys/{{ item.id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        status_code: [200, 204, 404]
      loop: "{{ linode_owned_keys }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Verify every owned Linode SSH key is absent
      ansible.builtin.uri:
        url: "https://api.linode.com/v4/profile/sshkeys/{{ item.id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ linode_token }}"
          Accept: application/json
        status_code: [200, 404]
      register: linode_key_absence
      until: linode_key_absence.status == 404
      retries: 12
      delay: 2
      loop: "{{ linode_owned_keys }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true

    - name: Remove deployment state after verified cloud cleanup
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../deployment_state_{{ deployment_id }}.json"
        state: absent

    - name: Report verified cleanup
      ansible.builtin.debug:
        msg:
          - "Linode cleanup verified for {{ deployment_id }}"
          - "Instances removed: {{ linode_owned_instances | length }}"
          - "Profile SSH keys removed: {{ linode_owned_keys | length }}"
